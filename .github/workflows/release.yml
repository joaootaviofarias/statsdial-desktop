name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.1)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      VERSION: ${{ github.event.inputs.version }}
      CSPROJ: src/StatsDial.Desktop/StatsDial.Desktop.csproj

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Bump version in csproj
        shell: pwsh
        run: |
          $content = Get-Content $env:CSPROJ -Raw
          $content = $content -replace '<Version>.*?</Version>', "<Version>$env:VERSION</Version>"
          $content = $content -replace '<AssemblyVersion>.*?</AssemblyVersion>', "<AssemblyVersion>$env:VERSION.0</AssemblyVersion>"
          $content = $content -replace '<FileVersion>.*?</FileVersion>', "<FileVersion>$env:VERSION.0</FileVersion>"
          $content = $content -replace '<InformationalVersion>.*?</InformationalVersion>', "<InformationalVersion>$env:VERSION</InformationalVersion>"
          Set-Content $env:CSPROJ $content

      - name: Commit and tag
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add "$CSPROJ"
          git commit -m "chore: bump version to $VERSION"
          git tag "v$VERSION"
          git push origin HEAD
          git push origin "v$VERSION"

      - name: Publish
        shell: bash
        run: |
          dotnet publish "$CSPROJ" \
            -c Release \
            -r win-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:Version=$VERSION \
            -o publish

      - name: Rename exe
        shell: bash
        run: mv publish/StatsDial.exe "publish/statsdial-$VERSION.exe"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          generate_release_notes: true
          files: publish/statsdial-${{ env.VERSION }}.exe
